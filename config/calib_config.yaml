%YAML:1.0
---
dataset:
  image_directory: "data/camera"
  image_extensions: [ ".jpg", ".jpeg", ".png", ".bmp" ]
  read_grayscale: 1

board:
  rows: 9
  cols: 11
  spacing_mm: 15.0

detector:
  min_contour_points: 20
  max_axis_ratio: 1.5
  marker_count: 5
  marker_spacing: 150.0
  row_tolerance: 7.5
  enable_subpixel: 1

logging:
  enabled: 1
  output_file: "debug_output/run.log"

debug:
  enabled: 0
  save_images: 1
  show_windows: 0
  output_directory: "debug_output"
